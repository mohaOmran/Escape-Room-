<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Room</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="escape-room">
      <button data-name="door"><span>🚪</span></button>
      <button data-name="wall-poster"><span>🌠</span></button>
      <button data-name="desk-drawer"><span>🗂️</span></button>
    </div>

    <div id="message-box">
      <div id="message-title"><span>System Message</span></div>
      <div id="message-description">
        <span>Here you will find interesting details that help you move forward in the game</span>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
